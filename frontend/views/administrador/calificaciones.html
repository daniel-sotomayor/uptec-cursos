<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="">
    <title>Calificaciones - Administrador | UPTECMS Cursos</title>
    <link rel="stylesheet" href="../../../frontend/css/main.css">
    <link rel="icon" type="image/png" href="../../img/logo-uptec.png">
</head>
<body>

<div class="layout">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <header class="header">
            <button class="sidebar-toggle" id="sidebar-toggle">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <h1 class="header__title">Registro de Calificaciones</h1>
            <div class="header__actions">
                <div class="header__search">
                    <svg class="header__search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" class="header__search-input" placeholder="Buscar por estudiante, curso o evaluación..." id="search-input">
                </div>
                <div class="header__user">
                    <div class="header__user-avatar" id="header-avatar"></div>
                    <div class="header__user-info">
                        <span class="header__user-name" id="header-user"></span>
                        <span class="header__user-role" id="header-role"></span>
                    </div>
                </div>
                <button class="header__logout" id="logout-btn" title="Cerrar Sesión">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </header>

        <div class="content">
            <div class="content__header">
                <div>
                    <h2 class="content__title">Todas las Calificaciones</h2>
                    <p class="content__subtitle">Visualiza y supervisa las notas asentadas en todas las asignaturas del sistema</p>
                </div>
            </div>

            <!-- Filtros -->
            <div class="card" style="margin-bottom: 1.5rem;">
                <div class="card__body" style="padding: 1rem 1.5rem;">
                    <div class="d-flex gap-4 flex-wrap">
                        <div style="flex: 1; min-width: 240px;">
                            <label class="form-label" style="font-size: 0.8125rem;">Filtrar por Curso</label>
                            <select class="form-select" id="filter-curso" onchange="loadCalificaciones()">
                                <option value="">Todos los cursos</option>
                            </select>
                        </div>
                        <div style="min-width: 180px;">
                            <label class="form-label" style="font-size: 0.8125rem;">Tipo de Evaluación</label>
                            <select class="form-select" id="filter-tipo" onchange="loadCalificaciones()">
                                <option value="">Todos los tipos</option>
                                <option value="Parcial">Parcial</option>
                                <option value="Final">Final</option>
                                <option value="Proyecto">Proyecto</option>
                                <option value="Asistencia">Asistencia</option>
                                <option value="Trabajo">Trabajo</option>
                                <option value="Otro">Otro</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div id="calificaciones-table">
                <div class="skeleton" style="height: 300px;"></div>
            </div>
        </div>
    </main>
</div>

<script src="../../../frontend/js/api.js"></script>
<script src="../../../frontend/js/auth.js"></script>
<script src="../../../frontend/js/dashboard.js"></script>
<script>
let currentCalificaciones = [];
let cursosList = [];

(async function() {
    await initDashboard();
    await loadCursos();
    loadCalificaciones();
    document.getElementById('search-input').addEventListener('input', debounce(() => loadCalificaciones(), 300));
})();

async function loadCursos() {
    try {
        const data = await API.get('cursos');
        cursosList = data.cursos || [];
        const select = document.getElementById('filter-curso');
        cursosList.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.id;
            opt.textContent = `${c.codigo} - ${c.nombre}`;
            select.appendChild(opt);
        });
    } catch (e) { 
        console.error("Error cargando cursos:", e); 
    }
}

async function loadCalificaciones() {
    Loading.show('calificaciones-table');
    try {
        const buscar = document.getElementById('search-input').value;
        const cursoId = document.getElementById('filter-curso').value;
        const tipo = document.getElementById('filter-tipo').value;
        const data = await API.get('calificaciones', { buscar, curso_id: cursoId, tipo });
        currentCalificaciones = data.calificaciones || [];
        renderCalificaciones(currentCalificaciones);
    } catch (err) {
        Toast.show('Error cargando calificaciones: ' + err.message, 'error');
    }
}

function renderCalificaciones(notas) {
    const iconEliminar = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>`;

    DataTable.render('calificaciones-table', notas, [
        { 
            label: 'Estudiante', 
            key: 'nombre_estudiante', 
            format: (v) => `<strong>${Utils.escapeHtml(v)}</strong>` 
        },
        { 
            label: 'Curso Asignado', 
            key: 'nombre_curso', 
            format: (v, r) => `<span class="badge badge--neutral" style="margin-bottom: 2px;">${Utils.escapeHtml(r.codigo_curso)}</span><br><small style="color:var(--color-text-secondary);">${Utils.escapeHtml(v)}</small>` 
        },
        { 
            label: 'Evaluación', 
            key: 'tipo_evaluacion', 
            format: (v, r) => `<strong>${Utils.escapeHtml(v)}</strong>${r.descripcion ? '<br><small style="color:var(--color-text-muted);">' + Utils.escapeHtml(r.descripcion) + '</small>' : ''}` 
        },
        { 
            label: 'Calificación', 
            key: 'nota', 
            format: (v) => {
                const notaNum = parseFloat(v);
                const badgeCls = notaNum >= 10 ? 'badge--accent' : notaNum >= 1 ? 'badge--warning' : 'badge--danger';
                return `<span class="badge ${badgeCls}" style="font-size:0.9375rem; font-weight:700;">${notaNum.toFixed(2)}</span>`;
            }
        },
        { 
            label: 'Ponderación', 
            key: 'peso', 
            format: (v) => `<strong>${parseFloat(v).toFixed(2)}%</strong>` 
        },
        { 
            label: 'Fecha Aplicada', 
            key: 'fecha_evaluacion', 
            format: (v) => `<small>${Utils.formatDate(v)}</small>` 
        }
    ], {
        actions: [
            { icon: iconEliminar, title: 'Eliminar Calificación', class: 'btn btn--sm btn--danger', onClick: (row) => `deleteCalificacion(${row.id})` }
        ]
    });
}

function deleteCalificacion(id) {
    ConfirmDialog.open('¿Estás seguro de eliminar esta calificación? El promedio y la condición académica del estudiante se recalcularán automáticamente.', async () => {
        try { 
            await API.delete('calificacion', id); 
            Toast.show('Calificación eliminada exitosamente', 'success'); 
            loadCalificaciones(); 
        } catch (err) { 
            Toast.show(err.message || 'Error al eliminar calificación', 'error'); 
        }
    });
}

function debounce(fn, ms) { 
    let t; 
    return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; 
}
</script>

</body>
</html>
