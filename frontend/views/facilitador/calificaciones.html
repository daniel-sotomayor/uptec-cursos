<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="">
    <title>Calificaciones - Facilitador | UPTECMS Cursos</title>
    <link rel="stylesheet" href="../../../frontend/css/main.css">
    <link rel="icon" type="image/png" href="../../img/logo-uptec.png">
</head>
<body>

<div class="layout">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <header class="header">
            <button class="sidebar-toggle" id="sidebar-toggle">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <h1 class="header__title">Registro de Calificaciones</h1>
            <div class="header__actions">
                <div class="header__user">
                    <div class="header__user-avatar" id="header-avatar"></div>
                    <div class="header__user-info">
                        <span class="header__user-name" id="header-user"></span>
                        <span class="header__user-role" id="header-role"></span>
                    </div>
                </div>
                <button class="header__logout" id="logout-btn" title="Cerrar Sesión">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </header>

        <div class="content">
            <div class="content__header">
                <div>
                    <h2 class="content__title">Calificaciones Agregadas</h2>
                    <p class="content__subtitle">Registra y supervisa las notas obtenidas por los estudiantes en cada evaluación</p>
                </div>
            </div>

            <div class="card" style="margin-bottom: 1.5rem;">
                <div class="card__body" style="padding: 1rem 1.5rem;">
                    <div class="d-flex gap-4 flex-wrap items-end justify-between">
                        <div style="flex: 1; max-width: 320px;">
                            <label class="form-label" style="font-size: 0.8125rem;">Filtrar por Curso</label>
                            <select class="form-select" id="filter-curso" onchange="loadCalificaciones()">
                                <option value="">Todas mis asignaturas</option>
                            </select>
                        </div>
                        <button class="btn btn--primary" onclick="openNotaModal()" style="display: inline-flex; align-items: center; gap: 0.4rem;">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            Agregar Calificación
                        </button>
                    </div>
                </div>
            </div>

            <div id="calificaciones-table"><div class="skeleton" style="height: 300px;"></div></div>
        </div>
    </main>
</div>

<script src="../../../frontend/js/api.js"></script>
<script src="../../../frontend/js/auth.js"></script>
<script src="../../../frontend/js/dashboard.js"></script>
<script>
let cursosList = [];

(async function() {
    await initDashboard();
    await loadCursos();
    loadCalificaciones();
})();

async function loadCursos() {
    try {
        const data = await API.get('mis-cursos');
        cursosList = data.cursos || [];
        const select = document.getElementById('filter-curso');
        cursosList.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.id;
            opt.textContent = `${c.codigo} - ${c.nombre}`;
            select.appendChild(opt);
        });
    } catch (e) { 
        console.error("Error al cargar cursos del docente:", e); 
    }
}

async function loadCalificaciones() {
    Loading.show('calificaciones-table');
    try {
        const cursoId = document.getElementById('filter-curso').value;
        const data = await API.get('calificaciones', cursoId ? { curso_id: cursoId } : {});
        renderCalificaciones(data.calificaciones || []);
    } catch (err) { 
        Toast.show('Error al obtener calificaciones: ' + err.message, 'error'); 
    }
}

function renderCalificaciones(notas) {
    DataTable.render('calificaciones-table', notas, [
        { 
            label: 'Estudiante', 
            key: 'nombre_estudiante', 
            format: (v) => `<strong>${Utils.escapeHtml(v)}</strong>` 
        },
        { 
            label: 'Asignatura', 
            key: 'nombre_curso', 
            format: (v, r) => `<span class="badge badge--neutral" style="margin-bottom:2px;">${Utils.escapeHtml(r.codigo_curso)}</span><br><small style="color:var(--color-text-secondary);">${Utils.escapeHtml(v)}</small>` 
        },
        { 
            label: 'Evaluación', 
            key: 'tipo_evaluacion', 
            format: (v, r) => `<strong>${v}</strong>${r.descripcion ? '<br><small style="color:var(--color-text-muted);">' + Utils.escapeHtml(r.descripcion) + '</small>' : ''}` 
        },
        { 
            label: 'Calificación', 
            key: 'nota', 
            format: (v) => {
                const notaNum = parseFloat(v);
                const badgeCls = notaNum >= 10 ? 'badge--accent' : notaNum >= 1 ? 'badge--warning' : 'badge--danger';
                return `<span class="badge ${badgeCls}" style="font-size:0.95rem; font-weight:700;">${notaNum.toFixed(2)} pts</span>`;
            }
        },
        { 
            label: 'Ponderación', 
            key: 'peso', 
            format: (v) => `<strong>${parseFloat(v).toFixed(2)}%</strong>` 
        },
        { 
            label: 'Fecha Aplicada', 
            key: 'fecha_evaluacion', 
            format: (v) => `<small>${Utils.formatDate(v)}</small>` 
        }
    ]);
}

function openNotaModal() {
    const cursoOptions = cursosList
        .filter(c => c.estado !== 'Finalizado')
        .map(c => `<option value="${c.id}">${c.codigo} - ${Utils.escapeHtml(c.nombre)}</option>`)
        .join('');

    const content = `
        <form id="nota-form">
            <div class="form-group" style="margin-bottom: 1rem;">
                <label class="form-label form-label--required">Asignatura / Curso Activo</label>
                <select class="form-select" id="nota-curso" onchange="cargarDatosRelacionados()" required>
                    <option value="">Selecciona una asignatura...</option>
                    ${cursoOptions}
                </select>
            </div>
            
            <div class="d-grid grid--2 gap-3" style="margin-bottom: 1rem;">
                <div class="form-group">
                    <label class="form-label form-label--required">Estudiante</label>
                    <select class="form-select" id="nota-inscripcion" required>
                        <option value="">Primero selecciona un curso</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label form-label--required">Evaluación del Plan</label>
                    <select class="form-select" id="nota-evaluacion" required>
                        <option value="">Primero selecciona un curso</option>
                    </select>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 1rem;">
                <label class="form-label form-label--required">Calificación Obtenida (Escala 0 a 20 puntos)</label>
                <input type="number" id="nota-valor" class="form-input" min="0" max="20" step="0.01" placeholder="ej. 16.50" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Observaciones y Retroalimentación (Opcional)</label>
                <textarea id="nota-obs" class="form-textarea" rows="2" placeholder="Notas sobre el desempeño del estudiante..."></textarea>
            </div>
        </form>
    `;

    const footer = `
        <button class="btn btn--ghost" onclick="Modal.close()">Cancelar</button>
        <button class="btn btn--primary" onclick="saveNota()">Guardar Calificación</button>
    `;

    Modal.open(content, { title: 'Agregar Calificación', footer });
}

async function cargarDatosRelacionados() {
    const cursoId = document.getElementById('nota-curso').value;
    const selectEstudiantes = document.getElementById('nota-inscripcion');
    const selectEvaluaciones = document.getElementById('nota-evaluacion');

    if (!cursoId) { 
        selectEstudiantes.innerHTML = '<option value="">Primero selecciona un curso</option>'; 
        selectEvaluaciones.innerHTML = '<option value="">Primero selecciona un curso</option>'; 
        return; 
    }

    selectEstudiantes.innerHTML = '<option value="">Cargando estudiantes...</option>';
    selectEvaluaciones.innerHTML = '<option value="">Cargando evaluaciones...</option>';

    try {
        // Cargar participantes activos
        const dataEst = await API.get('estudiantes-curso', { id: cursoId });
        const estudiantes = dataEst.estudiantes || [];
        selectEstudiantes.innerHTML = estudiantes.length ? 
            estudiantes.map(e => `<option value="${e.inscripcion_id}">${Utils.escapeHtml(e.nombre_estudiante)} (CI ${Utils.escapeHtml(e.cedula)})</option>`).join('') :
            '<option value="">No hay estudiantes inscritos en este curso</option>';

        // Cargar plan de evaluación configurado
        const dataEval = await API.get('evaluaciones-curso', { curso_id: cursoId });
        const evaluaciones = dataEval.evaluaciones || [];
        selectEvaluaciones.innerHTML = evaluaciones.length ? 
            evaluaciones.map(ev => `<option value="${ev.id}">${Utils.escapeHtml(ev.nombre)} — Ponderación: ${ev.peso}%</option>`).join('') :
            '<option value="">(Sin evaluaciones registradas en este curso)</option>';

    } catch (e) { 
        console.error("Error al cargar datos vinculados:", e);
        Toast.show('Error al consultar datos del curso', 'error');
    }
}

async function saveNota() {
    const data = {
        inscripcion_id: document.getElementById('nota-inscripcion').value,
        evaluacion_id: document.getElementById('nota-evaluacion').value,
        nota: document.getElementById('nota-valor').value,
        observaciones: document.getElementById('nota-obs').value.trim()
    };

    if (!data.inscripcion_id || !data.evaluacion_id || data.nota === '') { 
        Toast.show('Debes completar todos los campos requeridos', 'warning'); 
        return; 
    }

    const notaNum = parseFloat(data.nota);
    if (isNaN(notaNum) || notaNum < 0 || notaNum > 20) {
        Toast.show('La nota debe situarse entre 0 y 20 puntos', 'error');
        return;
    }

    try {
        await API.post('calificacion', data);
        Toast.show('Calificación agregada exitosamente', 'success');
        Modal.close(); 
        loadCalificaciones();
    } catch (err) { 
        Toast.show(err.message || 'Error al guardar la calificación', 'error'); 
    }
}
</script>

</body>
</html>
