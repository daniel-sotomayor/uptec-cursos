<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="">
    <title>Mis Cursos - Facilitador | UPTECMS Cursos</title>
    <link rel="stylesheet" href="../../../frontend/css/main.css">
    <link rel="icon" type="image/png" href="../../img/logo-uptec.png">
</head>
<body>

<div class="layout">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <header class="header">
            <button class="sidebar-toggle" id="sidebar-toggle">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <h1 class="header__title">Mis Cursos Asignados</h1>
            <div class="header__actions">
                <div class="header__user">
                    <div class="header__user-avatar" id="header-avatar"></div>
                    <div class="header__user-info">
                        <span class="header__user-name" id="header-user"></span>
                        <span class="header__user-role" id="header-role"></span>
                    </div>
                </div>
                <button class="header__logout" id="logout-btn" title="Cerrar Sesión">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </header>

        <div class="content">
            <div class="content__header">
                <div>
                    <h2 class="content__title">Gestión de Asignaturas Docentes</h2>
                    <p class="content__subtitle">Administra los cursos a tu cargo, supervisa estudiantes y planifica las evaluaciones</p>
                </div>
            </div>

            <!-- Filtros -->
            <div class="card" style="margin-bottom: 1.5rem;">
                <div class="card__body" style="padding: 1rem 1.5rem;">
                    <div class="d-flex gap-4 flex-wrap">
                        <div>
                            <label class="form-label" style="font-size: 0.8125rem;">Estado Académico</label>
                            <select class="form-select" id="filter-estado" style="width: 170px;" onchange="loadCursos()">
                                <option value="">Todos los estados</option>
                                <option value="Planificado">Planificados</option>
                                <option value="En Curso">En Curso</option>
                                <option value="Finalizado">Finalizados</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div id="cursos-grid">
                <div class="skeleton" style="height: 300px;"></div>
            </div>
        </div>
    </main>
</div>

<script src="../../../frontend/js/api.js"></script>
<script src="../../../frontend/js/auth.js"></script>
<script src="../../../frontend/js/dashboard.js"></script>
<script>
let currentCursos = [];

(async function() {
    await initDashboard();
    loadCursos();
})();

async function loadCursos() {
    const estado = document.getElementById('filter-estado').value;
    document.getElementById('cursos-grid').innerHTML = '<div class="skeleton" style="height: 300px;"></div>';
    
    try {
        const data = await API.get('mis-cursos', { estado });
        currentCursos = data.cursos || [];
        renderCursos(currentCursos);
    } catch (err) {
        Toast.show('Error al obtener cursos: ' + err.message, 'error');
    }
}

function renderCursos(cursos) {
    const container = document.getElementById('cursos-grid');
    
    if (!cursos.length) {
        container.innerHTML = `
            <div class="empty-state" style="padding: 3.5rem 1.5rem; text-align: center;">
                <div class="empty-state__icon" style="display: flex; justify-content: center; margin-bottom: 1rem;">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/>
                        <path d="M6 6h10M6 10h10"/>
                    </svg>
                </div>
                <div class="empty-state__title" style="font-weight: 700; color: var(--color-text-primary);">No tienes cursos asignados</div>
                <div class="empty-state__text" style="color: var(--color-text-muted); font-size: 0.9rem;">Las asignaturas asignadas por la coordinación académica aparecerán aquí</div>
            </div>`;
        return;
    }

    const estadoClass = {
        'Planificado': 'badge--primary',
        'En Curso': 'badge--accent',
        'Finalizado': 'badge--neutral'
    };

    container.innerHTML = `<div class="grid grid--2" style="gap: 1.5rem;">${cursos.map(c => `
        <div class="card" style="border-left: 4px solid var(--color-${c.estado === 'En Curso' ? 'accent' : c.estado === 'Finalizado' ? 'neutral' : 'primary'});">
            <div class="card__header" style="padding-bottom: 0.75rem;">
                <div>
                    <span class="badge ${estadoClass[c.estado] || 'badge--neutral'}">${c.estado}</span>
                    <h3 class="card__title" style="margin-top: 0.5rem;">${Utils.escapeHtml(c.codigo)}</h3>
                </div>
                <div style="text-align: right;">
                    <div style="font-size: 1.5rem; font-weight: 700; color: var(--color-primary);">${c.total_inscritos || 0}</div>
                    <div style="font-size: 0.75rem; color: var(--color-text-muted);">inscritos</div>
                </div>
            </div>
            <div class="card__body">
                <h4 style="font-size: 1.0625rem; margin-bottom: 0.5rem; color: var(--color-text-primary); font-weight: 700;">${Utils.escapeHtml(c.nombre)}</h4>
                <p style="color: var(--color-text-secondary); font-size: 0.875rem; margin-bottom: 1rem; line-height: 1.5;">${Utils.escapeHtml(c.descripcion || 'Sin descripción detallada')}</p>
                
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; margin-bottom: 1rem; font-size: 0.8125rem;">
                    <div><strong>Área:</strong> ${c.area || '-'}</div>
                    <div><strong>Nivel:</strong> ${c.nivel}</div>
                    <div><strong>Duración:</strong> ${c.duracion_horas}h</div>
                    <div><strong>Cupos:</strong> ${c.total_inscritos || 0} / ${c.cupo_maximo}</div>
                    <div><strong>Inicio:</strong> ${Utils.formatDate(c.fecha_inicio)}</div>
                    <div><strong>Fin:</strong> ${Utils.formatDate(c.fecha_fin)}</div>
                </div>
                
                ${c.promedio_general ? `
                <div style="background: var(--color-bg); padding: 0.75rem; border-radius: var(--radius-md); margin-bottom: 1rem;">
                    <div class="d-flex justify-between" style="font-size: 0.8125rem; margin-bottom: 0.25rem;">
                        <span>Promedio General</span>
                        <span style="font-weight: 700;">${c.promedio_general} pts</span>
                    </div>
                    <div style="background: var(--color-border-light); border-radius: var(--radius-full); height: 6px; overflow: hidden;">
                        <div style="background: ${c.promedio_general >= 10 ? 'var(--color-accent)' : 'var(--color-warning)'}; height: 100%; border-radius: var(--radius-full); width: ${(c.promedio_general / 20 * 100)}%;"></div>
                    </div>
                </div>
                ` : ''}
            </div>
            <div class="card__footer" style="flex-wrap: wrap; gap: 0.5rem;">
                <a href="estudiantes.html?curso=${c.id}" class="btn btn--sm btn--primary">Ver estudiantes</a>
                <a href="calificaciones.html?curso=${c.id}" class="btn btn--sm btn--outline">Calificaciones</a>
                ${c.estado === 'Finalizado' 
                    ? `<button onclick="verEgresadosCurso(${c.id}, '${Utils.escapeHtml(c.nombre)}')" class="btn btn--sm btn--accent" style="background: #2b6cb0; color: white; display: inline-flex; align-items: center; gap: 0.35rem;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
                        Lista de Egresados
                       </button>`
                    : `<button onclick="verPlanEvaluacion(${c.id})" class="btn btn--sm btn--ghost" style="display: inline-flex; align-items: center; gap: 0.35rem;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>
                        Plan de Evaluación
                       </button>`
                }
            </div>
        </div>
    `).join('')}</div>`;
}

// ========================================================
// GESTIONAR Y ELIMINAR EVALUACIONES
// ========================================================
window.verPlanEvaluacion = async function(cursoId) {
    try {
        const data = await API.get('evaluaciones-curso', { curso_id: cursoId });
        const evaluaciones = data.evaluaciones || [];
        const totalPeso = parseFloat(data.total_peso || 0);
        const disponible = parseFloat(data.disponible ?? (100 - totalPeso));

        const content = `
            <div style="margin-bottom: 1.25rem;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                    <div>
                        <span style="font-size: 0.875rem; color: var(--color-text-muted);">Ponderación Acumulada:</span>
                        <strong style="font-size: 1.125rem; color: ${totalPeso >= 100 ? 'var(--color-accent)' : 'var(--color-primary)'}; margin-left: 0.25rem;">${totalPeso}% / 100%</strong>
                    </div>
                    <div>
                        <span class="badge ${disponible > 0 ? 'badge--info' : 'badge--accent'}">
                            ${disponible > 0 ? `Disponible: ${disponible}%` : 'Plan Completo (100%)'}
                        </span>
                    </div>
                </div>
                <div style="background: var(--color-border-light); border-radius: var(--radius-full); height: 8px; overflow: hidden;">
                    <div style="background: ${totalPeso >= 100 ? 'var(--color-accent)' : 'var(--color-primary)'}; height: 100%; border-radius: var(--radius-full); width: ${Math.min(100, totalPeso)}%; transition: width 0.3s ease;"></div>
                </div>
            </div>

            ${evaluaciones.length ? `
                <div class="table-container" style="max-height: 320px; overflow-y: auto;">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Evaluación</th>
                                <th>Tipo</th>
                                <th style="text-align: center;">Peso (%)</th>
                                <th>Fecha Programada</th>
                                <th style="text-align: right;">Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${evaluaciones.map(ev => `
                                <tr>
                                    <td><strong>${Utils.escapeHtml(ev.nombre)}</strong></td>
                                    <td><span class="badge badge--neutral">${ev.tipo || 'Otro'}</span></td>
                                    <td style="text-align: center;"><span class="badge badge--primary" style="font-weight: 700;">${ev.peso}%</span></td>
                                    <td><small>${Utils.formatDate(ev.fecha_evaluacion)}</small></td>
                                    <td style="text-align: right;">
                                        <button onclick="eliminarEvaluacion(${ev.id}, ${cursoId})" class="btn btn--sm btn--ghost" style="color: var(--color-danger); display: inline-flex; align-items: center; gap: 0.25rem;" title="Eliminar evaluación">
                                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
                                            Eliminar
                                        </button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            ` : `
                <div class="empty-state" style="padding: 2rem 0; text-align: center;">
                    <div class="empty-state__icon" style="display: flex; justify-content: center; margin-bottom: 0.75rem;">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
                        </svg>
                    </div>
                    <div class="empty-state__title" style="font-weight: 700;">Sin evaluaciones configuradas</div>
                    <div class="empty-state__text" style="color: var(--color-text-muted); font-size: 0.85rem;">Añade evaluaciones para estructurar el 100% de la calificación definitiva del curso</div>
                </div>
            `}
        `;

        const footer = `
            <div style="display: flex; justify-content: space-between; width: 100%;">
                <button type="button" class="btn btn--ghost" onclick="Modal.close()">Cerrar</button>
                ${disponible > 0 ? `
                    <button type="button" class="btn btn--primary" onclick="abrirModalEvaluacion(${cursoId})" style="display: inline-flex; align-items: center; gap: 0.35rem;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        Añadir Evaluación
                    </button>
                ` : `
                    <span style="font-size: 0.8125rem; color: var(--color-text-muted); align-self: center;">Plan al 100% (No admite más evaluaciones)</span>
                `}
            </div>
        `;

        Modal.open(content, { title: 'Plan de Evaluación Académica', footer });
    } catch (err) {
        Toast.show('Error al consultar evaluaciones: ' + err.message, 'error');
    }
};

window.eliminarEvaluacion = function(evalId, cursoId) {
    ConfirmDialog.open('¿Deseas eliminar esta evaluación del plan? Esta acción no se puede deshacer.', async () => {
        try {
            const resp = await API.delete('evaluacion', evalId);
            if (resp.success) {
                Toast.show('Evaluación eliminada correctamente', 'success');
                verPlanEvaluacion(cursoId);
            }
        } catch (err) {
            Toast.show('Error eliminando evaluación: ' + err.message, 'error');
        }
    });
};

// ========================================================
// AÑADIR EVALUACIÓN CON VALIDACIÓN DE 100%
// ========================================================
window.abrirModalEvaluacion = async function(cursoId) {
    try {
        const data = await API.get('evaluaciones-curso', { curso_id: cursoId });
        const totalPeso = parseFloat(data.total_peso || 0);
        const disponible = parseFloat(data.disponible ?? (100 - totalPeso));

        if (disponible <= 0) {
            Toast.show(`El curso ya tiene el 100% de ponderación asignada. El porcentaje disponible es 0%.`, 'warning');
            verPlanEvaluacion(cursoId);
            return;
        }

        const content = `
            <form id="form-evaluacion" onsubmit="guardarEvaluacion(event, ${cursoId}, ${disponible})">
                <div style="background: var(--color-bg); padding: 0.75rem 1rem; border-radius: var(--radius-md); margin-bottom: 1rem; border-left: 4px solid var(--color-primary);">
                    <div style="font-size: 0.8125rem; color: var(--color-text-muted);">Ponderación actual: <strong>${totalPeso}%</strong></div>
                    <div style="font-size: 0.9375rem; color: var(--color-primary); font-weight: 600;">Máximo disponible para asignar: <strong>${disponible}%</strong></div>
                </div>

                <div class="form-group" style="margin-bottom: 1rem;">
                    <label class="form-label form-label--required">Nombre de la Evaluación</label>
                    <input type="text" id="eval_nombre" required placeholder="Ej: Examen Parcial 1" class="form-input">
                </div>
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label class="form-label form-label--required">Tipo</label>
                    <select id="eval_tipo" class="form-select" required>
                        <option value="Parcial">Parcial</option>
                        <option value="Proyecto">Proyecto</option>
                        <option value="Trabajo">Trabajo</option>
                        <option value="Asistencia">Asistencia</option>
                        <option value="Final">Final</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label class="form-label form-label--required">Peso en la nota final (%)</label>
                    <input type="number" id="eval_peso" min="0.5" max="${disponible}" step="0.5" required class="form-input" placeholder="Máx. ${disponible}%">
                    <small style="color: var(--color-text-muted); font-size: 0.75rem;">El peso no puede exceder el <strong>${disponible}%</strong> disponible.</small>
                </div>
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label class="form-label form-label--required">Fecha de Evaluación</label>
                    <input type="date" id="eval_fecha" required class="form-input">
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 1rem;">
                    <button type="button" class="btn btn--ghost" onclick="verPlanEvaluacion(${cursoId})">Volver al Plan</button>
                    <button type="submit" class="btn btn--primary" id="btn-save-eval">Guardar Evaluación</button>
                </div>
            </form>
        `;
        
        Modal.open(content, { title: 'Añadir al Plan de Evaluación' });
    } catch (err) {
        Toast.show('Error al preparar formulario: ' + err.message, 'error');
    }
};

window.guardarEvaluacion = async function(e, cursoId, maxDisponible) {
    e.preventDefault();
    
    const pesoInput = parseFloat(document.getElementById('eval_peso').value);
    if (pesoInput > maxDisponible) {
        Toast.show(`El peso ingresado (${pesoInput}%) supera el máximo disponible (${maxDisponible}%).`, 'error');
        return;
    }

    const btnSubmit = document.getElementById('btn-save-eval');
    btnSubmit.disabled = true;
    btnSubmit.textContent = 'Guardando...';

    const data = {
        curso_id: cursoId,
        nombre: document.getElementById('eval_nombre').value.trim(),
        tipo: document.getElementById('eval_tipo').value,
        peso: pesoInput,
        fecha_evaluacion: document.getElementById('eval_fecha').value
    };

    try {
        const response = await API.post('evaluacion', data);
        if (response.success) {
            Toast.show('Evaluación agregada al plan con éxito', 'success');
            verPlanEvaluacion(cursoId);
        }
    } catch (error) {
        Toast.show(error.message || 'Error al guardar la evaluación', 'error');
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Guardar Evaluación';
    }
};

window.verEgresadosCurso = async function(cursoId, nombreCurso) {
    Modal.open('<div class="text-center p-4"><div class="spinner spinner--lg"></div><p>Cargando egresados...</p></div>', {
        title: `Lista de Egresados - ${nombreCurso}`,
        size: 'modal--lg'
    });

    try {
        const res = await API.get('egresados-curso', { curso_id: cursoId });
        const lista = res.egresados || [];

        if (lista.length === 0) {
            Modal.open(`
                <div class="empty-state" style="padding: 2.5rem; text-align: center;">
                    <div class="empty-state__icon" style="display: flex; justify-content: center; margin-bottom: 0.75rem;">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                    </div>
                    <div class="empty-state__title" style="font-weight: 700;">No hay egresados registrados</div>
                    <div class="empty-state__text" style="color: var(--color-text-muted); font-size: 0.85rem;">Este curso finalizó sin alumnos inscritos o procesados.</div>
                </div>
            `, { title: `Lista de Egresados - ${nombreCurso}`, size: 'modal--lg' });
            return;
        }

        const aprobados = lista.filter(e => e.estado_academico === 'Aprobado').length;
        const reprobados = lista.length - aprobados;

        const content = `
            <div style="margin-bottom: 1rem; display: flex; gap: 1rem; background: var(--color-bg); padding: 0.75rem 1rem; border-radius: 8px;">
                <div><strong>Total Egresados:</strong> ${lista.length}</div>
                <div><strong style="color: var(--color-success, #38a169);">Aprobados:</strong> ${aprobados}</div>
                <div><strong style="color: var(--color-danger, #e53e3e);">Reprobados:</strong> ${reprobados}</div>
            </div>
            <div class="table-container" style="max-height: 400px; overflow-y: auto;">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Cédula</th>
                            <th>Estudiante</th>
                            <th>Nota Final</th>
                            <th>Condición</th>
                            <th>Fecha Egreso</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${lista.map(e => `
                            <tr>
                                <td><strong>CI ${Utils.escapeHtml(e.cedula)}</strong></td>
                                <td>${Utils.escapeHtml(e.nombre_estudiante)}</td>
                                <td><strong>${e.nota_final}</strong> / 20</td>
                                <td>
                                    <span class="badge ${e.estado_academico === 'Aprobado' ? 'badge--accent' : 'badge--danger'}" style="${e.estado_academico === 'Reprobado' ? 'background: #e53e3e; color: white;' : ''}">
                                        ${e.estado_academico}
                                    </span>
                                </td>
                                <td>${Utils.formatDate(e.fecha_egreso)}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;

        const footer = `<button class="btn btn--primary" onclick="Modal.close()">Cerrar</button>`;
        Modal.open(content, { title: `Lista de Egresados - ${nombreCurso}`, footer, size: 'modal--lg' });

    } catch (err) {
        Toast.show(err.message || 'Error cargando egresados', 'error');
    }
};
</script>

</body>
</html>
