<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="">
    <title>Dashboard - Facilitador | UPTECMS Cursos</title>
    <link rel="stylesheet" href="../../../frontend/css/main.css">
    <link rel="icon" type="image/png" href="../../img/logo-uptec.png">
</head>
<body>

<div class="layout">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <header class="header">
            <button class="sidebar-toggle" id="sidebar-toggle">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <h1 class="header__title">Panel de Facilitador Docente</h1>
            <div class="header__actions">
                <div class="header__user">
                    <div class="header__user-avatar" id="header-avatar"></div>
                    <div class="header__user-info">
                        <span class="header__user-name" id="header-user"></span>
                        <span class="header__user-role" id="header-role"></span>
                    </div>
                </div>
                <button class="header__logout" id="logout-btn" title="Cerrar Sesión">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </header>

        <div class="content">
            <div class="content__header">
                <div>
                    <h2 class="content__title">Bienvenido, Prof. <span id="user-name">Docente</span></h2>
                    <p class="content__subtitle">Gestiona tus asignaturas impartidas, planes de evaluación y calificaciones de estudiantes</p>
                </div>
            </div>

            <!-- Métricas del Facilitador -->
            <div class="grid grid--3" id="stats-container">
                <div class="stat-card skeleton" style="height: 140px;"></div>
                <div class="stat-card skeleton" style="height: 140px;"></div>
                <div class="stat-card skeleton" style="height: 140px;"></div>
            </div>

            <!-- Lista Rápida de Cursos -->
            <div class="card" style="margin-top: 1.5rem;">
                <div class="card__header">
                    <h3 class="card__title">Mis Cursos Asignados</h3>
                    <a href="mis-cursos.html" class="btn btn--sm btn--ghost">Ver catálogo completo</a>
                </div>
                <div class="card__body" id="mis-cursos">
                    <div class="skeleton" style="height: 200px;"></div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="../../../frontend/js/api.js"></script>
<script src="../../../frontend/js/auth.js"></script>
<script src="../../../frontend/js/dashboard.js"></script>
<script>
(async function() {
    await initDashboard();
    if (AUTH.user) document.getElementById('user-name').textContent = AUTH.user.nombre;

    try {
        const data = await API.get('resumen');
        if (data.success) {
            renderStats(data);
            renderMisCursos(data.cursos_activos || []);
        }
    } catch (err) {
        Toast.show('Error al cargar datos del panel: ' + err.message, 'error');
    }
})();

function renderStats(data) {
    const stats = [
        { 
            icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10M6 10h10"/></svg>', 
            cls: 'stat-card__icon--primary', 
            value: data.mis_cursos || 0, 
            label: 'Cursos Asignados' 
        },
        { 
            icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>', 
            cls: 'stat-card__icon--accent', 
            value: data.mis_estudiantes || 0, 
            label: 'Estudiantes a Cargo' 
        },
        { 
            icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>', 
            cls: 'stat-card__icon--secondary', 
            value: data.cursos_activos?.filter(c => c.estado === 'En Curso').length || 0, 
            label: 'En Curso Actualmente' 
        }
    ];

    document.getElementById('stats-container').innerHTML = stats.map(s => `
        <div class="stat-card" style="transition: transform 0.2s, box-shadow 0.2s;" onmouseover="this.style.transform='translateY(-4px)';this.style.boxShadow='var(--shadow-lg)'" onmouseout="this.style.transform='translateY(0)';this.style.boxShadow=''">
            <div class="stat-card__header">
                <div class="stat-card__icon ${s.cls}" style="display:flex; align-items:center; justify-content:center;">${s.icon}</div>
            </div>
            <div class="stat-card__value">${Utils.formatNumber(s.value)}</div>
            <div class="stat-card__label" style="font-weight:600; color:var(--color-text-secondary);">${s.label}</div>
        </div>
    `).join('');
}

function renderMisCursos(cursos) {
    const container = document.getElementById('mis-cursos');
    if (!cursos.length) { 
        container.innerHTML = `
            <div class="empty-state" style="padding: 2.5rem; text-align: center;">
                <div class="empty-state__icon" style="display: flex; justify-content: center; margin-bottom: 0.75rem;">
                    ${Icons.vacio(36)}
                </div>
                <div class="empty-state__title" style="font-weight: 700;">No tienes cursos asignados</div>
                <div class="empty-state__text" style="color: var(--color-text-muted); font-size: 0.875rem;">Las asignaturas asignadas por la coordinación académica aparecerán aquí.</div>
            </div>
        `; 
        return; 
    }

    // Icono SVG para ver la lista de estudiantes
    const iconEstudiantes = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`;

    DataTable.render('mis-cursos', cursos, [
        { 
            label: 'Código / Nombre', 
            key: 'codigo', 
            format: (v, r) => `<strong>${v}</strong><br><small style="color:var(--color-text-muted);">${Utils.escapeHtml(r.nombre)}</small>` 
        },
        { 
            label: 'Área Académica', 
            key: 'area',
            format: (v) => v || '-'
        },
        { 
            label: 'Inscritos / Cupo', 
            key: 'total_inscritos', 
            format: (v, r) => `<strong>${v || 0}</strong> / ${r.cupo_maximo}` 
        },
        { 
            label: 'Estado', 
            key: 'estado', 
            format: (v) => `<span class="badge ${v === 'En Curso' ? 'badge--accent' : v === 'Finalizado' ? 'badge--neutral' : 'badge--primary'}">${v}</span>` 
        },
        { 
            label: 'Período', 
            key: 'fecha_inicio', 
            format: (v, r) => `<small>${Utils.formatDate(v)}<br>${Utils.formatDate(r.fecha_fin)}</small>` 
        }
    ], {
        actions: [
            { 
                icon: iconEstudiantes, 
                title: 'Ver Estudiantes del Curso', 
                class: 'btn btn--sm btn--primary', 
                onClick: (row) => `window.location.href='estudiantes.html?curso=${row.id}'` 
            }
        ]
    });
}
</script>

</body>
</html>
