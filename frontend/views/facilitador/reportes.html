<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="">
    <title>Reportes - Facilitador | UPTECMS Cursos</title>
    <link rel="stylesheet" href="../../../frontend/css/main.css">
    <link rel="icon" type="image/png" href="../../img/logo-uptec.png">
</head>
<body>

<div class="layout">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <header class="header">
            <button class="sidebar-toggle" id="sidebar-toggle">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <h1 class="header__title">Reportes Académicos</h1>
            <div class="header__actions">
                <div class="header__user">
                    <div class="header__user-avatar" id="header-avatar"></div>
                    <div class="header__user-info">
                        <span class="header__user-name" id="header-user"></span>
                        <span class="header__user-role" id="header-role"></span>
                    </div>
                </div>
                <button class="header__logout" id="logout-btn" title="Cerrar Sesión">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </header>

        <div class="content">
            <div class="content__header">
                <div>
                    <h2 class="content__title">Rendimiento de Cursos Asignados</h2>
                    <p class="content__subtitle">Métricas de desempeño, promedios grupales y estadísticas de aprobación</p>
                </div>
            </div>

            <!-- Métricas Clave -->
            <div class="grid grid--4" id="stats-container" style="margin-bottom: 1.5rem;">
                <div class="stat-card skeleton" style="height: 140px;"></div>
                <div class="stat-card skeleton" style="height: 140px;"></div>
                <div class="stat-card skeleton" style="height: 140px;"></div>
                <div class="stat-card skeleton" style="height: 140px;"></div>
            </div>

            <!-- Gráficos de Desempeño y Distribución -->
            <div class="grid grid--2" style="margin-bottom: 1.5rem;">
                <div class="card">
                    <div class="card__header">
                        <h3 class="card__title">Desempeño Promedio por Curso</h3>
                    </div>
                    <div class="card__body" id="reporte-desempeno">
                        <div class="skeleton" style="height: 200px;"></div>
                    </div>
                </div>

                <div class="card">
                    <div class="card__header">
                        <h3 class="card__title">Distribución de Calificaciones</h3>
                    </div>
                    <div class="card__body" id="reporte-distribucion">
                        <div class="skeleton" style="height: 200px;"></div>
                    </div>
                </div>
            </div>

            <!-- Cuadro de Honor / Destacados -->
            <div class="card">
                <div class="card__header">
                    <h3 class="card__title">Estudiantes con Mayor Rendimiento</h3>
                </div>
                <div class="card__body" id="reporte-mejores">
                    <div class="skeleton" style="height: 250px;"></div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="../../../frontend/js/api.js"></script>
<script src="../../../frontend/js/auth.js"></script>
<script src="../../../frontend/js/dashboard.js"></script>
<script>
(async function() {
    await initDashboard();
    await loadReportes();
})();

async function loadReportes() {
    try {
        const [resumen, misCursos, calificaciones] = await Promise.all([
            API.get('resumen'),
            API.get('mis-cursos'),
            API.get('calificaciones')
        ]);

        renderStats(resumen);
        
        // Procesar datos de desempeño
        const cursos = misCursos.cursos || [];
        const desempeno = cursos.map(c => ({
            codigo: c.codigo,
            promedio: parseFloat(c.promedio_general) || 0,
            aprobados: c.total_completados || 0,
            reprobados: Math.max(0, (c.total_inscritos || 0) - (c.total_completados || 0))
        }));
        renderDesempeno(desempeno);
        
        // Distribución de calificaciones por rangos de nota
        const notas = calificaciones.calificaciones || [];
        const rangos = { '0-9': 0, '10-14': 0, '15-17': 0, '18-20': 0 };
        notas.forEach(n => {
            const nota = parseFloat(n.nota);
            if (nota < 10) rangos['0-9']++;
            else if (nota < 15) rangos['10-14']++;
            else if (nota < 18) rangos['15-17']++;
            else rangos['18-20']++;
        });
        const distribucion = Object.entries(rangos).map(([rango, cantidad]) => ({
            rango: rango + ' pts',
            cantidad,
            color: rango === '0-9' ? 'var(--color-danger)' : rango === '10-14' ? 'var(--color-warning)' : 'var(--color-accent)'
        })).filter(d => d.cantidad > 0);
        renderDistribucion(distribucion);
        
        renderMejores([]);
    } catch (err) {
        Toast.show('Error al generar los reportes: ' + err.message, 'error');
    }
}

function renderStats(data) {
    const stats = [
        { 
            icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10M6 10h10"/></svg>', 
            cls: 'stat-card__icon--primary', 
            value: data.mis_cursos || 0, 
            label: 'Cursos Asignados' 
        },
        { 
            icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>', 
            cls: 'stat-card__icon--accent', 
            value: data.mis_estudiantes || 0, 
            label: 'Total Estudiantes' 
        },
        { 
            icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>', 
            cls: 'stat-card__icon--secondary', 
            value: data.promedio_general || 0, 
            label: 'Promedio General' 
        },
        { 
            icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>', 
            cls: 'stat-card__icon--info', 
            value: data.tasa_aprobacion || 0, 
            label: 'Tasa de Aprobación' 
        }
    ];

    document.getElementById('stats-container').innerHTML = stats.map(s => `
        <div class="stat-card" style="transition: transform 0.2s, box-shadow 0.2s;" onmouseover="this.style.transform='translateY(-4px)';this.style.boxShadow='var(--shadow-lg)'" onmouseout="this.style.transform='translateY(0)';this.style.boxShadow=''">
            <div class="stat-card__header">
                <div class="stat-card__icon ${s.cls}" style="display:flex; align-items:center; justify-content:center;">${s.icon}</div>
            </div>
            <div class="stat-card__value">${s.label.includes('Tasa') ? s.value + '%' : Utils.formatNumber(s.value)}</div>
            <div class="stat-card__label" style="font-weight:600; color:var(--color-text-secondary);">${s.label}</div>
        </div>
    `).join('');
}

function renderDesempeno(cursos) {
    const container = document.getElementById('reporte-desempeno');
    if (!cursos.length) { 
        container.innerHTML = `<div class="empty-state" style="padding:2rem;"><div class="empty-state__icon">${Icons.vacio(36)}</div><div class="empty-state__title">Sin cursos asignados</div></div>`; 
        return; 
    }
    
    const max = Math.max(...cursos.map(c => c.promedio || 0), 1);

    container.innerHTML = `
        <div style="display:flex; flex-direction:column; gap:0.9rem;">
            ${cursos.map(c => `
                <div>
                    <div class="d-flex justify-between" style="margin-bottom:0.35rem;">
                        <span style="font-weight:600; font-size:0.9rem; color:var(--color-text-primary);">${Utils.escapeHtml(c.codigo)}</span>
                        <span style="font-weight:700; color:var(--color-${c.promedio >= 10 ? 'accent' : 'warning'}); font-size:0.9rem;">${c.promedio ? c.promedio.toFixed(2) + ' pts' : '-'}</span>
                    </div>
                    <div style="background:var(--color-border-light); border-radius:var(--radius-full); height:8px; overflow:hidden;">
                        <div style="background:var(--color-${c.promedio >= 10 ? 'accent' : 'warning'}); height:100%; border-radius:var(--radius-full); width:${(c.promedio / max * 100)}%; transition:width 0.5s;"></div>
                    </div>
                    <div style="font-size:0.75rem; color:var(--color-text-muted); margin-top:0.3rem;">
                        ${c.aprobados} estudiantes completados / ${c.reprobados} en progreso o pendientes
                    </div>
                </div>
            `).join('')}
        </div>
    `;
}

function renderDistribucion(data) {
    const container = document.getElementById('reporte-distribucion');
    if (!data || !data.length) { 
        container.innerHTML = `<div class="empty-state" style="padding:2rem;"><div class="empty-state__icon">${Icons.vacio(36)}</div><div class="empty-state__title">No hay notas registradas</div></div>`; 
        return; 
    }

    const total = data.reduce((sum, d) => sum + d.cantidad, 0) || 1;

    container.innerHTML = `
        <div style="display:flex; flex-direction:column; gap:0.9rem;">
            ${data.map(d => `
                <div>
                    <div class="d-flex justify-between" style="margin-bottom:0.35rem;">
                        <span style="font-weight:600; font-size:0.9rem; color:var(--color-text-primary);">${d.rango}</span>
                        <span style="font-weight:700; color:var(--color-text-secondary); font-size:0.9rem;">${d.cantidad} evaluaciones (${Math.round(d.cantidad / total * 100)}%)</span>
                    </div>
                    <div style="background:var(--color-border-light); border-radius:var(--radius-full); height:8px; overflow:hidden;">
                        <div style="background:${d.color || 'var(--color-primary)'}; height:100%; border-radius:var(--radius-full); width:${(d.cantidad / total * 100)}%; transition:width 0.5s;"></div>
                    </div>
                </div>
            `).join('')}
        </div>
    `;
}

function renderMejores(data) {
    const container = document.getElementById('reporte-mejores');
    if (!data || !data.length) { 
        container.innerHTML = `
            <div class="empty-state" style="padding:2.5rem; text-align:center;">
                <div class="empty-state__icon" style="display:flex; justify-content:center; margin-bottom:0.75rem;">
                    ${Icons.vacio(36)}
                </div>
                <div class="empty-state__title" style="font-weight:700;">Sin evaluaciones concluidas</div>
                <div class="empty-state__text" style="color:var(--color-text-muted); font-size:0.875rem;">A medida que se registren calificaciones definitivas se destacarán los mejores promedios</div>
            </div>
        `; 
        return; 
    }

    DataTable.render('reporte-mejores', data, [
        { 
            label: 'Estudiante', 
            key: 'nombre_estudiante', 
            format: (v) => `<strong>${Utils.escapeHtml(v)}</strong>` 
        },
        { 
            label: 'Curso', 
            key: 'nombre_curso', 
            format: (v) => `<small>${Utils.escapeHtml(v)}</small>` 
        },
        { 
            label: 'Nota Final', 
            key: 'nota_final', 
            format: (v) => `<span class="badge ${parseFloat(v) >= 18 ? 'badge--accent' : 'badge--primary'}" style="font-size:0.95rem; font-weight:800;">${parseFloat(v).toFixed(2)}</span>` 
        },
        { 
            label: 'Estado', 
            key: 'estado', 
            format: (v) => `<span class="badge badge--accent">${v}</span>` 
        }
    ]);
}
</script>

</body>
</html>
