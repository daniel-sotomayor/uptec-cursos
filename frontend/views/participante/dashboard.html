<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="">
    <title>Dashboard - Participante | UPTECMS Cursos</title>
    <link rel="stylesheet" href="../../../frontend/css/main.css">
    <link rel="icon" type="image/png" href="../../img/logo-uptec.png">
</head>
<body>

<div class="layout">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <header class="header">
            <button class="sidebar-toggle" id="sidebar-toggle">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <h1 class="header__title">Panel del Participante</h1>
            <div class="header__actions">
                <div class="header__user">
                    <div class="header__user-avatar" id="header-avatar"></div>
                    <div class="header__user-info">
                        <span class="header__user-name" id="header-user"></span>
                        <span class="header__user-role" id="header-role"></span>
                    </div>
                </div>
                <button class="header__logout" id="logout-btn" title="Cerrar Sesión">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </header>

        <div class="content">
            <div class="content__header">
                <div>
                    <h2 class="content__title">Bienvenido, <span id="user-name">Estudiante</span></h2>
                    <p class="content__subtitle">Consulta tus asignaturas inscritas, notas parciales y avance curricular</p>
                </div>
            </div>

            <!-- Métricas Principales del Estudiante -->
            <div class="grid grid--3" id="stats-container">
                <div class="stat-card skeleton" style="height: 140px;"></div>
                <div class="stat-card skeleton" style="height: 140px;"></div>
                <div class="stat-card skeleton" style="height: 140px;"></div>
            </div>

            <!-- Asignaturas Inscritas -->
            <div class="card" style="margin-top: 1.5rem;">
                <div class="card__header">
                    <h3 class="card__title">Mis Cursos Inscritos</h3>
                    <a href="mis-cursos.html" class="btn btn--sm btn--ghost">Ver catálogo</a>
                </div>
                <div class="card__body" id="mis-cursos">
                    <div class="skeleton" style="height: 200px;"></div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="../../../frontend/js/api.js"></script>
<script src="../../../frontend/js/auth.js"></script>
<script src="../../../frontend/js/dashboard.js"></script>
<script>
(async function() {
    await initDashboard();
    if (AUTH.user) document.getElementById('user-name').textContent = AUTH.user.nombre;

    try {
        const data = await API.get('resumen');
        if (data.success) {
            renderStats(data);
            renderMisCursos(data.inscripciones || []);
        }
    } catch (err) {
        Toast.show('Error al obtener información académica: ' + err.message, 'error');
    }
})();

function renderStats(data) {
    const stats = [
        { 
            icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10M6 10h10"/></svg>', 
            cls: 'stat-card__icon--primary', 
            value: data.mis_cursos || 0, 
            label: 'Cursos Inscritos' 
        },
        { 
            icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>', 
            cls: 'stat-card__icon--accent', 
            value: data.cursos_completados || 0, 
            label: 'Cursos Culminados' 
        },
        { 
            icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>', 
            cls: 'stat-card__icon--secondary', 
            value: data.promedio_general ? parseFloat(data.promedio_general).toFixed(2) : '0.00', 
            label: 'Promedio General' 
        }
    ];

    document.getElementById('stats-container').innerHTML = stats.map(s => `
        <div class="stat-card" style="transition: transform 0.2s, box-shadow 0.2s;" onmouseover="this.style.transform='translateY(-4px)';this.style.boxShadow='var(--shadow-lg)'" onmouseout="this.style.transform='translateY(0)';this.style.boxShadow=''">
            <div class="stat-card__header">
                <div class="stat-card__icon ${s.cls}" style="display:flex; align-items:center; justify-content:center;">${s.icon}</div>
            </div>
            <div class="stat-card__value">${s.value}</div>
            <div class="stat-card__label" style="font-weight:600; color:var(--color-text-secondary);">${s.label}</div>
        </div>
    `).join('');
}

function renderMisCursos(inscripciones) {
    const container = document.getElementById('mis-cursos');
    if (!inscripciones.length) { 
        container.innerHTML = `
            <div class="empty-state" style="padding: 2.5rem 1.5rem; text-align: center;">
                <div class="empty-state__icon" style="display: flex; justify-content: center; margin-bottom: 0.75rem;">
                    ${Icons.vacio(36)}
                </div>
                <div class="empty-state__title" style="font-weight: 700;">No estás inscrito en ningún curso</div>
                <div class="empty-state__text" style="color: var(--color-text-muted); font-size: 0.875rem; margin-bottom: 1rem;">
                    Explora la oferta académica disponible para tu carrera e inscríbete para iniciar tu formación.
                </div>
                <a href="inscribir.html" class="btn btn--sm btn--primary" style="display: inline-flex; align-items: center; gap: 0.35rem;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Inscribirme Ahora
                </a>
            </div>
        `; 
        return; 
    }

    const estadoBadge = { 
        'Inscrito': 'badge--primary', 
        'En Progreso': 'badge--accent', 
        'Completado': 'badge--accent', 
        'Reprobado': 'badge--danger', 
        'Abandonado': 'badge--neutral' 
    };

    // Vector SVG para ver notas
    const iconNotas = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>`;

    DataTable.render('mis-cursos', inscripciones, [
        { 
            label: 'Código / Asignatura', 
            key: 'codigo', 
            format: (v, r) => `<strong>${v || ''}</strong><br><small style="color:var(--color-text-muted);">${Utils.escapeHtml(r.nombre)}</small>` 
        },
        { 
            label: 'Área Académica', 
            key: 'area',
            format: (v) => v || '-'
        },
        { 
            label: 'Estado', 
            key: 'estado', 
            format: (v) => `<span class="badge ${estadoBadge[v] || 'badge--neutral'}">${v}</span>` 
        },
        { 
            label: 'Calificación Final', 
            key: 'nota_final', 
            format: (v) => {
                if (v !== null && v !== undefined && v !== '') {
                    const notaNum = parseFloat(v);
                    const badgeCls = notaNum >= 10 ? 'badge--accent' : 'badge--danger';
                    return `<span class="badge ${badgeCls}" style="font-size:0.95rem; font-weight:800;">${notaNum.toFixed(2)} pts</span>`;
                }
                return '<span class="badge badge--neutral" style="font-size:0.75rem;">En progreso</span>';
            }
        }
    ], {
        actions: [
            { 
                icon: iconNotas, 
                title: 'Ver Calificaciones', 
                class: 'btn btn--sm btn--primary', 
                onClick: (row) => `window.location.href='mis-notas.html'` 
            }
        ]
    });
}
</script>

</body>
</html>
