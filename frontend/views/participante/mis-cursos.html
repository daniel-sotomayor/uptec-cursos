<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="">
    <title>Mis Cursos - Participante | UPTECMS Cursos</title>
    <link rel="stylesheet" href="../../../frontend/css/main.css">
    <link rel="icon" type="image/png" href="../../img/logo-uptec.png">
</head>
<body>

<div class="layout">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <header class="header">
            <button class="sidebar-toggle" id="sidebar-toggle">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <h1 class="header__title">Mis Cursos</h1>
            <div class="header__actions">
                <div class="header__user">
                    <div class="header__user-avatar" id="header-avatar"></div>
                    <div class="header__user-info">
                        <span class="header__user-name" id="header-user"></span>
                        <span class="header__user-role" id="header-role"></span>
                    </div>
                </div>
                <button class="header__logout" id="logout-btn" title="Cerrar Sesión">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </header>

        <div class="content">
            <div class="content__header">
                <div>
                    <h2 class="content__title">Mis Asignaturas Inscritas</h2>
                    <p class="content__subtitle">Listado y seguimiento de las asignaturas en las que estás formalmente inscrito</p>
                </div>
                <a href="inscribir.html" class="btn btn--accent" style="display: inline-flex; align-items: center; gap: 0.4rem;">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Inscribirme en otro curso
                </a>
            </div>

            <div id="mis-cursos-container">
                <div class="skeleton" style="height: 300px;"></div>
            </div>
        </div>
    </main>
</div>

<script src="../../../frontend/js/api.js"></script>
<script src="../../../frontend/js/auth.js"></script>
<script src="../../../frontend/js/dashboard.js"></script>
<script>
(async function() {
    await initDashboard();
    loadMisCursos();
})();

async function loadMisCursos() {
    try {
        const data = await API.get('mis-cursos');
        renderMisCursos(data.cursos || []);
    } catch (err) {
        Toast.show('Error al obtener tus cursos: ' + err.message, 'error');
    }
}

function renderMisCursos(cursos) {
    const container = document.getElementById('mis-cursos-container');
    if (!cursos.length) {
        container.innerHTML = `
            <div class="empty-state" style="padding: 3.5rem 1.5rem; text-align: center;">
                <div class="empty-state__icon" style="display: flex; justify-content: center; margin-bottom: 1rem;">
                    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/>
                        <path d="M6 6h10M6 10h10"/>
                    </svg>
                </div>
                <div class="empty-state__title" style="font-weight: 700; color: var(--color-text-primary);">No estás inscrito en ningún curso actualmente</div>
                <div class="empty-state__text" style="color: var(--color-text-muted); font-size: 0.9rem; margin-bottom: 1.25rem;">
                    Revisa las asignaturas abiertas para tu carrera y formaliza tu inscripción.
                </div>
                <a href="inscribir.html" class="btn btn--primary" style="display: inline-flex; align-items: center; gap: 0.4rem;">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Ver Cursos Disponibles
                </a>
            </div>
        `;
        return;
    }

    const estadoBadge = { 
        'Inscrito': 'badge--primary', 
        'En Progreso': 'badge--accent', 
        'Completado': 'badge--accent', 
        'Reprobado': 'badge--danger',
        'Abandonado': 'badge--neutral'
    };

    // Vector SVG para ver notas
    const iconNotas = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>`;

    DataTable.render('mis-cursos-container', cursos, [
        { 
            label: 'Código / Asignatura', 
            key: 'codigo', 
            format: (v, r) => `<span class="badge badge--neutral" style="margin-bottom:2px;">${v}</span><br><strong>${Utils.escapeHtml(r.nombre)}</strong>` 
        },
        { 
            label: 'Área Académica', 
            key: 'area',
            format: (v) => `<small>${v || 'General'}</small>`
        },
        { 
            label: 'Duración', 
            key: 'duracion_horas', 
            format: (v) => `${v} horas` 
        },
        { 
            label: 'Facilitador Asignado', 
            key: 'nombre_facilitador', 
            format: (v) => `<small>${Utils.escapeHtml(v || 'Por asignar')}</small>` 
        },
        { 
            label: 'Estado', 
            key: 'estado_inscripcion', 
            badge: estadoBadge 
        },
        { 
            label: 'Calificación Final', 
            key: 'nota_final', 
            format: (v) => {
                if (v !== null && v !== undefined && v !== '') {
                    const notaNum = parseFloat(v);
                    const badgeCls = notaNum >= 10 ? 'badge--accent' : 'badge--danger';
                    return `<span class="badge ${badgeCls}" style="font-size: 0.95rem; font-weight: 800;">${notaNum.toFixed(2)} pts</span>`;
                }
                return '<span class="badge badge--neutral" style="font-size: 0.75rem;">En progreso</span>';
            }
        }
    ], {
        actions: [
            { 
                icon: iconNotas, 
                title: 'Consultar Notas', 
                class: 'btn btn--sm btn--primary', 
                onClick: () => `window.location.href='mis-notas.html'` 
            }
        ]
    });
}
</script>

</body>
</html>
