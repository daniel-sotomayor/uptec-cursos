<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="">
    <title>Verificación - Analista | UPTECMS Cursos</title>
    <link rel="icon" type="image/png" href="../../img/logo-uptec.png">
    <link rel="stylesheet" href="../../../frontend/css/main.css">
</head>
<body>

<div class="layout">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <header class="header">
            <button class="sidebar-toggle" id="sidebar-toggle">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <h1 class="header__title">Verificación y Control Curricular</h1>
            <div class="header__actions">
                <div class="header__user">
                    <div class="header__user-avatar" id="header-avatar"></div>
                    <div class="header__user-info">
                        <span class="header__user-name" id="header-user"></span>
                        <span class="header__user-role" id="header-role"></span>
                    </div>
                </div>
                <button class="header__logout" id="logout-btn" title="Cerrar Sesión">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </header>

        <div class="content">
            <div class="content__header">
                <div>
                    <h2 class="content__title">Control de Estados de Cursos</h2>
                    <p class="content__subtitle">Activa asignaturas planificadas para apertura o regrésalas a planificación si requieren ajustes</p>
                </div>
            </div>

            <!-- Métricas Clave -->
            <div class="grid grid--4" id="stats-container" style="margin-bottom: 1.5rem;">
                <div class="stat-card skeleton" style="height: 120px;"></div>
                <div class="stat-card skeleton" style="height: 120px;"></div>
                <div class="stat-card skeleton" style="height: 120px;"></div>
                <div class="stat-card skeleton" style="height: 120px;"></div>
            </div>

            <!-- Tabla de Control -->
            <div class="card">
                <div class="card__header">
                    <h3 class="card__title">Gestión de Cursos por Estado</h3>
                    <div class="d-flex gap-2">
                        <select class="form-select" id="filter-estado" style="width: 180px;" onchange="loadCursos()">
                            <option value="">Todos los estados</option>
                            <option value="Planificado">Planificados</option>
                            <option value="En Curso">En Curso</option>
                            <option value="Finalizado">Finalizados</option>
                        </select>
                    </div>
                </div>
                <div class="card__body" id="cursos-verificar">
                    <div class="skeleton" style="height: 300px;"></div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="../../../frontend/js/api.js"></script>
<script src="../../../frontend/js/auth.js"></script>
<script src="../../../frontend/js/dashboard.js"></script>
<script>
let currentCursos = [];

(async function() {
    await initDashboard();
    await loadStats();
    loadCursos();
})();

async function loadStats() {
    try {
        const data = await API.get('resumen');
        if (data.success) {
            const stats = [
                { 
                    icon: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>', 
                    cls: 'stat-card__icon--primary', 
                    value: data.cursos_planificados || 0, 
                    label: 'Planificados' 
                },
                { 
                    icon: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10M6 10h10"/></svg>', 
                    cls: 'stat-card__icon--accent', 
                    value: data.cursos_activos || 0, 
                    label: 'En Curso' 
                },
                { 
                    icon: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="17" x2="22" y1="8" y2="13"/><line x1="22" x2="17" y1="8" y2="13"/></svg>', 
                    cls: 'stat-card__icon--secondary', 
                    value: Array.isArray(data.cursos_sin_facilitador) ? data.cursos_sin_facilitador.length : (data.total_sin_facilitador || 0), 
                    label: 'Sin Facilitador' 
                },
                { 
                    icon: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>', 
                    cls: 'stat-card__icon--info', 
                    value: data.cursos_verificados || 0, 
                    label: 'Verificados / Activos' 
                }
            ];

            document.getElementById('stats-container').innerHTML = stats.map(s => `
                <div class="stat-card">
                    <div class="stat-card__header">
                        <div class="stat-card__icon ${s.cls}" style="display:flex; align-items:center; justify-content:center;">${s.icon}</div>
                    </div>
                    <div class="stat-card__value">${Utils.formatNumber(s.value)}</div>
                    <div class="stat-card__label" style="font-weight:600; color:var(--color-text-secondary);">${s.label}</div>
                </div>
            `).join('');
        }
    } catch (e) { 
        console.error("Error al cargar métricas:", e); 
    }
}

async function loadCursos() {
    Loading.show('cursos-verificar');
    try {
        const estado = document.getElementById('filter-estado').value;
        const data = await API.get('cursos', { estado });
        currentCursos = data.cursos || [];
        renderCursos(currentCursos);
    } catch (err) {
        Toast.show('Error al cargar cursos: ' + err.message, 'error');
    }
}

function renderCursos(cursos) {
    const estadoBadge = { 
        'Planificado': 'badge--primary', 
        'En Curso': 'badge--accent', 
        'Finalizado': 'badge--neutral', 
        'Verificado': 'badge--accent',
        'Cancelado': 'badge--danger'
    };

    DataTable.render('cursos-verificar', cursos, [
        { 
            label: 'Código / Nombre', 
            key: 'codigo', 
            format: (v, r) => `<strong>${v}</strong><br><small style="color:var(--color-text-muted);">${Utils.escapeHtml(r.nombre)}</small>` 
        },
        { 
            label: 'Área / Nivel', 
            key: 'area', 
            format: (v, r) => `<small>${v || '-'}<br><span style="color:var(--color-text-muted);">${r.nivel}</span></small>` 
        },
        { 
            label: 'Duración', 
            key: 'duracion_horas', 
            format: (v) => `${v}h` 
        },
        { 
            label: 'Facilitador Asignado', 
            key: 'nombre_facilitador', 
            format: (v) => v 
                ? `<span style="font-weight:600; color:var(--color-accent);">${Utils.escapeHtml(v)}</span>` 
                : '<span class="badge badge--danger" style="font-size:0.75rem;">Sin asignar</span>' 
        },
        { 
            label: 'Inscritos', 
            key: 'total_inscritos', 
            format: (v, r) => `<strong>${v || 0}</strong> / ${r.cupo_maximo}` 
        },
        { 
            label: 'Estado Actual', 
            key: 'estado', 
            badge: estadoBadge 
        },
        { 
            label: 'Acción de Control', 
            key: 'id', 
            format: (id, row) => {
                if (row.estado === 'Finalizado') {
                    return `<span style="font-size:0.8rem; color:var(--color-text-muted); font-weight:600;">Curso Concluido</span>`;
                }

                if (row.estado === 'Planificado') {
                    return `
                        <button onclick="cambiarEstadoCurso(${id}, 'En Curso')" class="btn btn--sm btn--primary" style="display:inline-flex; align-items:center; gap:0.4rem;" title="Activar asignatura e iniciar clases">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                            Iniciar Curso
                        </button>
                    `;
                }

                // Si está en 'En Curso' o 'Verificado'
                return `
                    <button onclick="cambiarEstadoCurso(${id}, 'Planificado')" class="btn btn--sm btn--ghost" style="display:inline-flex; align-items:center; gap:0.4rem; color:#b45309; border:1px solid #f59e0b;" title="Pausar y devolver a planificación">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                        A Planificado
                    </button>
                `;
            }
        }
    ]);
}

function cambiarEstadoCurso(id, nuevoEstado) {
    const curso = currentCursos.find(c => c.id === id);
    const nombreCurso = curso ? curso.nombre : 'este curso';

    const esActivacion = nuevoEstado === 'En Curso';
    const mensaje = esActivacion
        ? `¿Deseas iniciar y activar "${Utils.escapeHtml(nombreCurso)}"? Pasará al estado "En Curso".`
        : `¿Deseas inhabilitar "${Utils.escapeHtml(nombreCurso)}"? Volverá al estado "Planificado" para ajustes.`;

    ConfirmDialog.open(mensaje, async () => {
        try {
            await API.put('curso', id, { estado: nuevoEstado });
            Toast.show(`Curso actualizado a "${nuevoEstado}" exitosamente`, 'success');
            loadCursos();
            loadStats();
        } catch (err) {
            Toast.show(err.message || 'Error al actualizar el estado del curso', 'error');
        }
    });
}
</script>

</body>
</html>
