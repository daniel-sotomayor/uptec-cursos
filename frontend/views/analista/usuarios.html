<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="">
    <title>Usuarios - Analista | UPTECMS Cursos</title>
    <link rel="stylesheet" href="../../../frontend/css/main.css">
    <link rel="icon" type="image/png" href="../../img/logo-uptec.png">
</head>
<body>

<div class="layout">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <header class="header">
            <button class="sidebar-toggle" id="sidebar-toggle">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <h1 class="header__title">Directorio de Usuarios</h1>
            <div class="header__actions">
                <div class="header__search">
                    <svg class="header__search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" class="header__search-input" placeholder="Buscar por nombre, cédula o correo..." id="search-input">
                </div>
                <div class="header__user">
                    <div class="header__user-avatar" id="header-avatar"></div>
                    <div class="header__user-info">
                        <span class="header__user-name" id="header-user"></span>
                        <span class="header__user-role" id="header-role"></span>
                    </div>
                </div>
                <button class="header__logout" id="logout-btn" title="Cerrar Sesión">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </header>

        <div class="content">
            <div class="content__header">
                <div>
                    <h2 class="content__title">Directorio de Usuarios Académicos</h2>
                    <p class="content__subtitle">Consulta y supervisión de participantes y facilitadores registrados en la UPTECMS</p>
                </div>
            </div>

            <!-- Filtros -->
            <div class="card" style="margin-bottom: 1.5rem;">
                <div class="card__body" style="padding: 1rem 1.5rem;">
                    <div class="d-flex gap-4 flex-wrap">
                        <div>
                            <label class="form-label" style="font-size: 0.8125rem;">Rol Académico</label>
                            <select class="form-select" id="filter-rol" style="width: 170px;" onchange="loadUsers()">
                                <option value="">Todos los roles</option>
                                <option value="Participante">Participante</option>
                                <option value="Facilitador">Facilitador</option>
                            </select>
                        </div>
                        <div>
                            <label class="form-label" style="font-size: 0.8125rem;">Condición de Cuenta</label>
                            <select class="form-select" id="filter-estado" style="width: 180px;" onchange="loadUsers()">
                                <option value="">Todos los estados</option>
                                <option value="1">Activo / Verificado</option>
                                <option value="0">Pendiente / Inactivo</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div id="users-table">
                <div class="skeleton" style="height: 300px;"></div>
            </div>
        </div>
    </main>
</div>

<script src="../../../frontend/js/api.js"></script>
<script src="../../../frontend/js/auth.js"></script>
<script src="../../../frontend/js/dashboard.js"></script>
<script>
let currentUsers = [];

(async function() {
    await initDashboard();
    loadUsers();
    document.getElementById('search-input').addEventListener('input', debounce(() => loadUsers(), 300));
})();

async function loadUsers() {
    Loading.show('users-table');
    try {
        const buscar = document.getElementById('search-input').value;
        const rol = document.getElementById('filter-rol').value;
        const activo = document.getElementById('filter-estado').value;

        const data = await API.get('usuarios', { buscar, rol, activo });
        // El analista supervisa participantes y facilitadores
        currentUsers = (data.usuarios || []).filter(u => u.rol === 'Participante' || u.rol === 'Facilitador');
        renderUsers(currentUsers);
    } catch (err) {
        Toast.show('Error al obtener el listado de usuarios: ' + err.message, 'error');
    }
}

function renderUsers(usuarios) {
    const badgeMap = {
        'Facilitador': 'badge--secondary',
        'Participante': 'badge--accent'
    };

    // Vector SVG para ver detalles
    const iconVer = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`;

    DataTable.render('users-table', usuarios, [
        { 
            label: 'Usuario', 
            key: 'nombre', 
            format: (v, r) => `<strong>${Utils.escapeHtml(v)} ${Utils.escapeHtml(r.apellidos)}</strong><br><small style="color:var(--color-text-muted);">CI ${Utils.escapeHtml(r.cedula)}</small>` 
        },
        { 
            label: 'Correo Electrónico', 
            key: 'correo', 
            format: (v) => `<small>${Utils.escapeHtml(v || '-')}</small>` 
        },
        { 
            label: 'Teléfono', 
            key: 'telefono', 
            format: (v) => `<small>${Utils.escapeHtml(v || '-')}</small>` 
        },
        { 
            label: 'Carrera / Área', 
            key: 'area', 
            format: (v) => `<small>${Utils.escapeHtml(v || 'General')}</small>` 
        },
        { 
            label: 'Rol', 
            key: 'rol', 
            badge: badgeMap 
        },
        { 
            label: 'Estado', 
            key: 'activo', 
            format: (v) => `<span class="badge ${v == 1 ? 'badge--accent' : 'badge--warning'}">${v == 1 ? 'Activo' : 'Pendiente'}</span>` 
        },
        { 
            label: 'Último Acceso', 
            key: 'ultimo_acceso', 
            format: (v) => `<small>${v ? Utils.formatDateTime(v) : '<span style="color:var(--color-text-muted);">Sin ingresos</span>'}</small>` 
        }
    ], {
        actions: [
            { icon: iconVer, title: 'Ver Ficha Completa', class: 'btn btn--sm btn--ghost', onClick: (row) => `verDetalleUsuario(${row.id})` }
        ]
    });
}

function verDetalleUsuario(id) {
    const user = currentUsers.find(u => u.id === id);
    if (!user) return;

    const content = `
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; font-size: 0.9rem;">
            <div><strong>Cédula:</strong> CI ${Utils.escapeHtml(user.cedula)}</div>
            <div><strong>Rol Asignado:</strong> <span class="badge badge--primary">${user.rol}</span></div>
            <div><strong>Nombres:</strong> ${Utils.escapeHtml(user.nombre)}</div>
            <div><strong>Apellidos:</strong> ${Utils.escapeHtml(user.apellidos)}</div>
            <div><strong>Correo:</strong> ${Utils.escapeHtml(user.correo)}</div>
            <div><strong>Teléfono:</strong> ${Utils.escapeHtml(user.telefono || 'Sin registrar')}</div>
            <div><strong>Carrera / Especialidad:</strong> ${Utils.escapeHtml(user.area || 'Sin especificar')}</div>
            <div><strong>Estado de Cuenta:</strong> <span class="badge ${user.activo == 1 ? 'badge--accent' : 'badge--warning'}">${user.activo == 1 ? 'Activo / Verificado' : 'Pendiente de aprobación'}</span></div>
            <div><strong>Fecha de Registro:</strong> ${Utils.formatDateTime(user.creado_en)}</div>
            <div><strong>Último Acceso:</strong> ${user.ultimo_acceso ? Utils.formatDateTime(user.ultimo_acceso) : 'Sin ingresos previos'}</div>
        </div>
    `;

    const footer = `
        <button class="btn btn--ghost" onclick="Modal.close()">Cerrar</button>
        ${user.rol === 'Facilitador' && user.activo == 0 ? `
            <button class="btn btn--primary" onclick="activarFacilitador(${user.id})" style="display:inline-flex; align-items:center; gap:0.4rem;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                Aprobar y Habilitar Docente
            </button>
        ` : ''}
    `;

    Modal.open(content, { title: 'Ficha del Usuario', footer });
}

async function activarFacilitador(id) {
    try {
        const user = currentUsers.find(u => u.id === id);
        if (!user) return;
        await API.put('usuario', id, {
            nombre: user.nombre,
            apellidos: user.apellidos,
            telefono: user.telefono,
            rol: user.rol,
            area: user.area,
            activo: 1
        });
        Toast.show('Facilitador aprobado y activado exitosamente', 'success');
        Modal.close();
        loadUsers();
    } catch (err) {
        Toast.show('Error al aprobar facilitador: ' + err.message, 'error');
    }
}

function debounce(fn, ms) {
    let timeout;
    return (...args) => { clearTimeout(timeout); timeout = setTimeout(() => fn(...args), ms); };
}
</script>

</body>
</html>
